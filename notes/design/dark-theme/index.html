<html lang="en">

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

			rel="stylesheet"

		/>
		<style>
			:root {
				color-scheme: dark;
				--ground: #1d1e20;
				--panel: #26272a;
				--rule: #393a3e;
				--text: #ecebe8;
				--text-2: #b9b8b3;
				--muted: #8f8e89;
				--select: #f0d58c;
				--serif: "Newsreader", "Iowan Old Style", Georgia, serif;
				--sans:
					"Instrument Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
				--gutter: clamp(16px, 4vw, 48px);
			}
			* {
				box-sizing: border-box;
			}
			body {
				background: var(--ground);
				color: var(--text);
				font: 400 15px/1.5 var(--sans);
				padding-inline: var(--gutter);
				padding-block: 40px 96px;
			}
			.wrap {
				max-width: 1400px;
				margin-inline: auto;
				display: grid;
				gap: 40px;
			}
			header {
				display: grid;
				gap: 12px;
				max-width: 70ch;
			}
			h1 {
				font: 600 clamp(34px, 5vw, 56px)/1.02 var(--serif);
				letter-spacing: -0.015em;
				margin: 0;
				text-wrap: balance;
			}
			header p {
				margin: 0;
				color: var(--text-2);
				font-size: 16px;
			}
			h2 {
				font: 600 28px/1.15 var(--serif);
				margin: 0;
				text-wrap: balance;
			}
			h3 {
				font: 600 15px/1.3 var(--sans);
				margin: 0;
				color: var(--text);
			}

			.bar {
				display: flex;
				flex-wrap: wrap;
				gap: 16px 24px;
				align-items: center;
			}
			.seg {
				display: inline-flex;
				border: 1px solid var(--rule);
				border-radius: 999px;
				padding: 3px;
			}
			.seg button {
				font: 500 14px/1 var(--sans);
				color: var(--text-2);
				background: none;
				border: 0;
				padding: 9px 16px;
				border-radius: 999px;
				cursor: pointer;
			}
			.seg button[aria-pressed="true"] {
				background: var(--text);
				color: var(--ground);
			}
			button:focus-visible,
			a:focus-visible,
			.shot:focus-visible {
				outline: 2px solid var(--select);
				outline-offset: 2px;
			}

			.picker {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
				gap: 10px;
			}
			.pick {
				display: grid;
				gap: 10px;
				text-align: left;
				cursor: pointer;
				background: var(--panel);
				color: var(--text);
				border: 1px solid var(--rule);
				border-radius: 10px;
				padding: 10px;
				font: 500 14px/1.2 var(--sans);
			}
			.pick[aria-pressed="true"] {
				border-color: var(--select);
				box-shadow: inset 0 0 0 1px var(--select);
			}
			.strip {
				display: flex;
				height: 34px;
				border-radius: 6px;
				overflow: hidden;
				box-shadow: 0 0 0 1px rgb(255 255 255 / 0.14);
			}
			.strip span {
				flex: 1;
			}
			.strip span:first-child {
				flex: 3;
			}

			.intro {
				display: grid;
				grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
				gap: 32px 48px;
				align-items: start;
			}
			.intro .summary {
				display: grid;
				gap: 14px;
			}
			.intro .summary p {
				margin: 0;
				font: 400 19px/1.5 var(--serif);
				color: var(--text);
				max-width: 60ch;
			}
			.intro .summary .bold {
				font: 400 15px/1.5 var(--sans);
				color: var(--text-2);
			}
			.intro .bold strong {
				color: var(--text);
				font-weight: 600;
			}
			.facts {
				display: grid;
				gap: 20px;
			}
			.swatches {
				display: grid;
				gap: 12px;
			}
			.sg {
				display: grid;
				grid-template-columns: 88px 1fr;
				gap: 10px;
				align-items: start;
			}
			.sg > span {
				color: var(--muted);
				font-size: 13px;
				padding-top: 4px;
			}
			.chips {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
			}
			.chip {
				display: grid;
				grid-template-columns: 22px auto;
				gap: 2px 8px;
				align-items: center;
				background: var(--panel);
				border-radius: 6px;
				padding: 4px 9px 4px 4px;
				font-size: 12px;
				line-height: 1.2;
			}
			.chip i {
				grid-row: span 2;
				width: 22px;
				height: 22px;
				border-radius: 4px;
				box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.12);
			}
			.chip b {
				font-weight: 500;
			}
			.chip code {
				font:
					400 11px/1 ui-monospace,
					Menlo,
					monospace;
				color: var(--muted);
			}

			table {
				border-collapse: collapse;
				width: 100%;
				font-size: 14px;
			}
			td {
				padding: 6px 0;
				border-top: 1px solid var(--rule);
				vertical-align: baseline;
			}
			td:first-child {
				color: var(--muted);
				width: 110px;
			}
			.sig {
				background: var(--panel);
				border-radius: 8px;
				padding: 12px 14px;
				display: grid;
				gap: 6px;
				font-size: 14px;
				color: var(--text-2);
			}
			.sig .face {
				font-size: 28px;
				line-height: 1.1;
				color: var(--text);
			}
			.note {
				color: var(--select);
				font-size: 14px;
			}

			.steps {
				display: grid;
				gap: 44px;
			}
			.step {
				display: grid;
				gap: 12px;
			}
			.step header {
				display: flex;
				gap: 12px;
				align-items: baseline;
				max-width: none;
			}
			.step .n {
				font: 600 28px/1 var(--serif);
				color: var(--muted);
				font-variant-numeric: tabular-nums;
				min-width: 1.6ch;
			}
			.step .state {
				color: var(--muted);
				font:
					400 13px/1 ui-monospace,
					Menlo,
					monospace;
			}
			.pair {
				display: grid;
				grid-template-columns: 1.6fr 0.5622fr;
				gap: 12px;
				align-items: start;
			}
			.shot {
				display: block;
				border-radius: 6px;
				overflow: hidden;
				background: #000;
				cursor: zoom-in;
				border: 0;
				padding: 0;
				width: 100%;
			}
			.shot img {
				display: block;
				width: 100%;
				height: auto;
			}
			.cap {
				color: var(--muted);
				font-size: 12px;
				margin-top: 6px;
			}

			.step-picker {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
			}
			.step-picker button {
				font: 500 13px/1 var(--sans);
				background: var(--panel);
				color: var(--text-2);
				border: 1px solid var(--rule);
				border-radius: 999px;
				padding: 8px 12px;
				cursor: pointer;
			}
			.step-picker button[aria-pressed="true"] {
				background: var(--text);
				color: var(--ground);
				border-color: var(--text);
			}
			.compare {
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: 36px 24px;
			}
			.compare .cell {
				display: grid;
				gap: 10px;
			}
			.compare .cell h3 button {
				all: unset;
				cursor: pointer;
				border-bottom: 1px solid var(--rule);
			}

			dialog {
				border: 0;
				padding: 0;
				background: transparent;
				max-width: 96vw;
				max-height: 94vh;
			}
			dialog::backdrop {
				background: rgb(0 0 0 / 0.85);
			}
			dialog img {
				display: block;
				max-width: 96vw;
				max-height: 90vh;
				width: auto;
				height: auto;
				border-radius: 6px;
			}
			dialog p {
				color: #ddd;
				margin: 8px 0 0;
				font-size: 13px;
			}

			@media (max-width: 900px) {
				.intro {
					grid-template-columns: 1fr;
				}
				.compare {
					grid-template-columns: 1fr;
				}
			}
			@media (max-width: 560px) {
				.pair {
					grid-template-columns: 1fr;
				}
				.pair .m {
					max-width: 260px;
				}
				.sg {
					grid-template-columns: 1fr;
				}
			}
		</style>
	</head>

				<h1>Kevin Bacon after dark</h1>
				<p>

				</p>
			</header>

					<button type="button" id="v-step" aria-pressed="false">
						Compare a step
					</button>
				</div>
			</div>
			<main id="view"></main>
		</div>

				[0, "networkIntro", "The constellation"],
				[3, "titleGalaxy", "Title card"],
				[4, "hopBands", "Hop bands"],
				[7, "rankReveal", "Rank ladder"],
				[10, "raceFull", "The race, in full"],
				[14, "scatterCenters", "Scatter with costars"],
				[17, "scatterQuiz", "Pair quiz"],
				[22, "careerMany", "Careers"],
				[24, "simRace", "Simulated race"],
				[26, "outro", "Outro"]
			];
			const SLOT_GROUPS = [
				[
					"Surfaces",
					["bg", "raised", "line", "cardLine", "selection", "markBg"]
				],
				["Text", ["fg", "fg2", "muted"]],
				[
					"Canvas",
					["ink", "crowd", "edge", "trail", "career", "right", "wrong"]
				],
				["Hop bands", ["hop1", "hop2", "hop3", "hop4", "band"]],
				["Hop labels", ["hop1L", "hop2L", "hop3L", "hop4L", "bandL"]]
			];
			const SLOT_NAMES = {
				bg: "page",
				raised: "raised",
				line: "hairline",
				cardLine: "card edge",
				selection: "selection",
				markBg: "<mark>",
				fg: "body",
				fg2: "secondary",
				muted: "muted",
				ink: "named dot",
				crowd: "crowd",
				edge: "link",
				trail: "race accent",
				career: "career",
				right: "quiz right",
				wrong: "quiz wrong",
				hop1: "1 movie",
				hop2: "2 movies",
				hop3: "3 movies",
				hop4: "4 movies",
				band: "race band",
				hop1L: "1 movie",
				hop2L: "2 movies",
				hop3L: "3 movies",
				hop4L: "4 movies",
				bandL: "race band"
			};
			const $ = (h) => {
				const t = document.createElement("template");
				t.innerHTML = h.trim();
				return t.content.firstElementChild;
			};
			const esc = (s) =>
				String(s).replace(
					/[&<>"]/g,
					(c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]
				);
			const FACE = {
				Limelight: '"Limelight", serif',
				"JetBrains Mono": '"JetBrains Mono", monospace'
			};
			let state = { view: "dir", theme: THEMES[0].key, step: STEPS[2][0] };
			try {
				const s = JSON.parse(localStorage.getItem("kb-dark") || "null");
				if (s) state = { ...state, ...s };
			} catch {}
			const h = location.hash.slice(1);
			if (THEMES.some((t) => t.key === h && !t.reference))
				state = { ...state, view: "dir", theme: h };
			if (/^step-\d+$/.test(h))
				state = { ...state, view: "step", step: Number(h.slice(5)) };

			const src = (key, step, box) => `shots/${key}/${step}-${box}.jpg`;
			const shot = (t, step, box, label) =>
				`<button type="button" class="shot ${box === "mobile" ? "m" : "d"}" data-src="${src(t.key, step, box)}" data-cap="${esc(label)}"><img loading="lazy" src="${src(t.key, step, box)}" alt="${esc(label)}" width="${box === "mobile" ? 750 : 1280}" height="${box === "mobile" ? 1334 : 800}" /></button>`;
			const pair = (t, [n, , title]) =>
				`<div class="pair">${shot(t, n, "desktop", `${t.name}, step ${n} (${title}), desktop`)}${shot(t, n, "mobile", `${t.name}, step ${n} (${title}), mobile`)}</div>`;
			const strip = (p) =>
				`<div class="strip">${[p.bg, p.ink, p.hop1, p.hop2, p.hop3, p.fg].map((c) => `<span style="background:${c}"></span>`).join("")}</div>`;

			function dirView() {
				const DIRS = THEMES.filter((x) => !x.reference);
				const t = DIRS.find((x) => x.key === state.theme) ?? DIRS[0];
				const picker = DIRS.map(
					(x) =>
						`<button type="button" class="pick" data-theme="${x.key}" aria-pressed="${x.key === t.key}">${strip(x.palette)}${esc(x.name)}</button>`
				).join("");
				const swatches = SLOT_GROUPS.map(
					([g, slots]) =>
						`<div class="sg"><span>${g}</span><div class="chips">${slots.map((s) => `<span class="chip"><i style="background:${t.palette[s]}"></i><b>${esc(SLOT_NAMES[s])}</b><code>${t.palette[s]}</code></span>`).join("")}</div></div>`
				).join("");
				const type = `<table><tbody>${t.type.map(([r, f]) => `<tr><td>${r}</td><td>${esc(f)}</td></tr>`).join("")}</tbody></table>`;
				const sig = t.signature
					? `<div class="sig"><span class="face" style="font-family:${FACE[t.signature.family]}">Gen Z's Kevin Bacon</span><span><strong>${esc(t.signature.family)}</strong> on ${esc(t.signature.role)}. ${esc(t.signature.licence)}</span></div>`
					: `<div class="sig">House set only: loads from pudding.cool, no new licence.</div>`;
				const a = t.a11y;
				const axe = `<div class="sig"><span><strong>Rendered contrast (axe, every step, mobile and desktop):</strong> ${esc(a.summary)}.</span>${a.fails.length ? `<span>${esc(a.fails.join(", "))}</span>` : ""}${a.detail.map((d) => `<code style="font-size:11px;word-break:break-word">${esc(d)}</code>`).join("")}<span>The token contrast spec passes for every pair.</span></div>`;
				const caveat = t.caveat ? `<p class="note">${esc(t.caveat)}</p>` : "";
				const misses = t.misses.length
					? `<p class="note">Landed elsewhere: ${t.misses.map((m) => `step ${m.step} → ${m.landed} (${m.box})`).join(", ")}</p>`
					: "";
				const steps = STEPS.map(
					(s) =>
						`<section class="step"><header><span class="n">${s[0]}</span><h3>${esc(s[2])}</h3><span class="state">${s[1]}</span></header>${pair(t, s)}</section>`
				).join("");
				return `<div style="display:grid;gap:36px"><div class="picker">${picker}</div>
			<section class="intro"><div class="summary"><h2>${esc(t.name)}</h2><p>${esc(t.principle)}</p><p class="bold"><strong>Where the boldness sits:</strong> ${esc(t.boldness)}</p>${misses}${caveat}</div>
			<div class="facts"><div class="swatches">${swatches}</div><div><h3 style="margin-bottom:6px">Type roles</h3>${type}</div>${sig}${axe}</div></section>
			<div class="steps">${steps}</div></div>`;
			}

			function stepView() {
				const s = STEPS.find((x) => x[0] === state.step);
				const chips = STEPS.map(
					(x) =>
						`<button type="button" data-step="${x[0]}" aria-pressed="${x[0] === s[0]}">${x[0]} ${esc(x[2])}</button>`
				).join("");
				const cells = THEMES.map(
					(t) =>
						`<div class="cell"><h3>${t.reference ? `${esc(t.name)} <span style="color:var(--muted);font-weight:400">(for reference)</span>` : `<button type="button" data-goto="${t.key}">${esc(t.name)}</button>`}</h3>${pair(t, s)}</div>`
				).join("");
				return `<div style="display:grid;gap:28px"><div class="step-picker">${chips}</div><div class="compare">${cells}</div></div>`;
			}

			const view = document.getElementById("view");
			function render() {
				document
					.getElementById("v-dir")
					.setAttribute("aria-pressed", state.view === "dir");
				document
					.getElementById("v-step")
					.setAttribute("aria-pressed", state.view === "step");
				view.replaceChildren(
					$(`<div>${state.view === "dir" ? dirView() : stepView()}</div>`)
				);
				try {
					localStorage.setItem("kb-dark", JSON.stringify(state));
				} catch {}
			}
			document.getElementById("v-dir").onclick = () => {
				state.view = "dir";
				render();
			};
			document.getElementById("v-step").onclick = () => {
				state.view = "step";
				render();
			};
			const lb = document.getElementById("lb");
			lb.onclick = () => lb.close();
			view.addEventListener("click", (e) => {
				const b = e.target.closest("button");
				if (!b) return;
				if (b.dataset.theme) {
					state.theme = b.dataset.theme;
					render();
				} else if (b.dataset.step) {
					state.step = Number(b.dataset.step);
					render();
				} else if (b.dataset.goto) {
					state.theme = b.dataset.goto;
					state.view = "dir";
					render();
					scrollTo(0, 0);
				} else if (b.dataset.src) {
					lb.querySelector("img").src = b.dataset.src;
					lb.querySelector("p").textContent = b.dataset.cap;
					lb.showModal();
				}
			});
			render();
		</script>
	</body>
</html>
